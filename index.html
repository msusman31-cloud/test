<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Adventure</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scene">
        <div class="sky"></div>
        <div class="sun"></div>
        <div class="mountain mountain1"></div>
        <div class="mountain mountain2"></div>
        <div class="mountain mountain3"></div>
        <div class="landscape"></div>
        <div class="clouds">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
        </div>
        <div class="snow" id="snow"></div>
        <div class="birds" id="birds">
            <div class="bird bird1">🐦</div>
            <div class="bird bird2">🐦</div>
        </div>
    </div>
    <div class="weather-info" id="weather-info">
        <h1 id="city-name">Loading...</h1>
        <p id="weather-desc">Searching for clear skies</p>
        <span id="temp-value">--°C</span>
    </div>

    <div class="search-container">
        <input type="text" id="city-input" placeholder="Enter city name..." aria-label="City Name">
        <button id="search-btn">Search</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
